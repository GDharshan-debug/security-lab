<!DOCTYPE html>
<html>
<head><title>Vulnerability: Security Lab</title></head>
<body>
<h1>Welcome to Security Lab</h1>

<h2>1. Login (SQL Injection Test)</h2>
Username: <input id="user"><br><br>
Password: <input id="pass" type="password"><br><br>
<button onclick="login()">Login</button>
<p id="out"></p>

<h2>2. Search (XSS Test)</h2>
<input id="search" placeholder="Search here">
<button onclick="search()">Search</button>
<p id="sout"></p>

<script>
function login(){
  var u = document.getElementById("user").value;
  var q = "SELECT * FROM users WHERE user='" + u + "' AND pass='xxx'";
  var result = "Login failed";
  if(u.includes("' OR '1'='1") || u.includes('" OR "1"="1') || u.includes("OR 1=1") || u.includes("or 1=1") || u.includes("' OR 1=1")){
    result = "Login Success! SQL Injection Worked!";
  }
  document.getElementById("out").innerHTML = "Query: " + q + "<br>" + result;
}
function search(){
  var s = document.getElementById("search").value;
  document.getElementById("sout").innerHTML = "You searched for: " + s;
}
</script>
</body>
</html>
