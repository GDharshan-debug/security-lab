<!DOCTYPE html>
<html>
<body>
<h2>Mini Lab</h2>

<h3>1. Login</h3>
<input id="u" placeholder="Username">
<button onclick="login()">Login</button>
<p id="a"></p>

<h3>2. Comment</h3>
<input id="c" placeholder="Comment">
<button onclick="comment()">Post</button>
<p id="b"></p>

<script>
function login(){
let u=document.getElementById("u").value;
if(u.includes("' OR '1'='1")){
document.getElementById("a").innerHTML="SQLi SUCCESS - Admin Login!";
}else{
document.getElementById("a").innerHTML="Login Failed";
}
}
function comment(){
let c=document.getElementById("c").value;
document.getElementById("b").innerHTML="You said: "+c;
}
</script>
</body>
</html>
